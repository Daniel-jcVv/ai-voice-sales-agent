<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Center Store — AI Sales Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #2792DC;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .features {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .feature {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 1.2rem;
        }

        .feature-icon { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .feature-title { color: #fff; font-weight: 600; margin-bottom: 0.3rem; }
        .feature-desc { color: #888; font-size: 0.85rem; }

        .cta {
            color: #666;
            font-size: 0.9rem;
        }

        .cta span {
            color: #2792DC;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Data Center Store</h1>
        <p class="subtitle">AI-powered sales assistant — available 24/7</p>

        <!-- Features section -->
        <div class="features">
            <div class="feature">
                <div class="feature-icon">&#128230;</div>
                <div class="feature-title">Products</div>
                <div class="feature-desc">Browse 30+ server components and peripherals</div>
            </div>
            <div class="feature">
                <div class="feature-icon">&#128203;</div>
                <div class="feature-title">Orders</div>
                <div class="feature-desc">Track your order status in real time</div>
            </div>
            <div class="feature">
                <div class="feature-icon">&#128274;</div>
                <div class="feature-title">Secure</div>
                <div class="feature-desc">Identity verification before sharing data</div>
            </div>
        </div>

        <p class="cta">Click the <span>widget</span> in the bottom-right corner to start a conversation</p>
    </div>

    <!-- ElevenLabs Conversational AI Widget -->
    <!-- Replace agent-id with your own from ElevenLabs Dashboard > Agents -->
    <elevenlabs-convai agent-id="agent_7101kh825h4ne60t8fbf99d5g2te"></elevenlabs-convai>
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

</body>
</html>
